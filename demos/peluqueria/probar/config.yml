# Panel de PRUEBAS (público): no guarda nada, todo vive en la memoria del navegador.
backend:
  name: test-repo
locale: es
media_folder: demos/peluqueria/img
public_folder: img
collections:
- name: web
  label: Mi web
  files:
  - name: contenido
    label: Contenido de la web
    file: demos/peluqueria/content.json
    fields:
    - label: Negocio
      name: business
      widget: object
      fields:
      - label: Nombre
        name: name
        widget: string
      - label: Eslogan
        name: tagline
        widget: string
      - label: Descripción
        name: description
        widget: text
      - label: Teléfono
        name: phone
        widget: string
      - label: Email
        name: email
        widget: string
      - label: WhatsApp
        name: whatsapp
        widget: string
      - label: Dirección
        name: address
        widget: object
        fields:
        - label: Calle y número
          name: street
          widget: string
        - label: Código postal
          name: postalCode
          widget: string
        - label: Ciudad
          name: city
          widget: string
        - label: Enlace del mapa (opcional)
          name: mapEmbedUrl
          widget: string
          required: false
      - label: Foto principal
        name: heroImage
        widget: object
        fields:
        - label: Imagen
          name: url
          widget: image
        - label: Descripción de la imagen
          name: alt
          widget: string
      - label: Buscadores (SEO)
        name: seo
        widget: object
        fields:
        - label: Título
          name: title
          widget: string
        - label: Descripción
          name: description
          widget: text
    - label: Servicios
      name: services
      widget: list
      fields:
      - label: Nombre
        name: name
        widget: string
      - label: Platos
        name: items
        widget: list
        fields:
        - label: Nombre
          name: name
          widget: string
        - label: Nota
          name: note
          widget: text
        - label: Precio (€)
          name: price
          widget: number
          value_type: float
          min: 0
        summary: '{{fields.name}}'
      summary: '{{fields.name}}'
    - label: Equipo
      name: team
      widget: list
      fields:
      - label: Nombre
        name: name
        widget: string
      - label: Cargo
        name: role
        widget: string
      - label: Presentación
        name: bio
        widget: text
      summary: '{{fields.name}}'
    - label: Galería
      name: gallery
      widget: list
      fields:
      - label: Imagen
        name: url
        widget: image
      - label: Descripción de la imagen
        name: alt
        widget: string
    - label: Horarios
      name: openingHours
      widget: list
      fields:
      - label: Días
        name: days
        widget: string
      - label: Horario
        name: time
        widget: string
      summary: '{{fields.days}}'
    - label: Redes sociales
      name: socialLinks
      widget: object
      fields:
      - label: Instagram
        name: instagram
        widget: string
        required: false
