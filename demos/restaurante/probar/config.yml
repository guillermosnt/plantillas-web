# Panel de PRUEBAS (público): no guarda nada, todo vive en la memoria del navegador.
backend:
  name: test-repo
locale: es
media_folder: demos/restaurante/img
public_folder: img
collections:
- name: web
  label: Mi web
  files:
  - name: contenido
    label: Contenido de la web
    file: demos/restaurante/content.json
    fields:
    - label: Negocio
      name: business
      widget: object
      fields:
      - label: Nombre
        name: name
        widget: string
      - label: Eslogan
        name: tagline
        widget: string
      - label: Descripción
        name: description
        widget: text
      - label: Teléfono
        name: phone
        widget: string
      - label: Email
        name: email
        widget: string
      - label: WhatsApp
        name: whatsapp
        widget: string
      - label: Dirección
        name: address
        widget: object
        fields:
        - label: Calle y número
          name: street
          widget: string
        - label: Código postal
          name: postalCode
          widget: string
        - label: Ciudad
          name: city
          widget: string
        - label: Enlace del mapa (opcional)
          name: mapEmbedUrl
          widget: string
          required: false
      - label: Foto principal
        name: heroImage
        widget: object
        fields:
        - label: Imagen
          name: url
          widget: image
        - label: Descripción de la imagen
          name: alt
          widget: string
      - label: Buscadores (SEO)
        name: seo
        widget: object
        fields:
        - label: Título
          name: title
          widget: string
        - label: Descripción
          name: description
          widget: text
    - label: Menú del día
      name: dailyMenu
      widget: object
      fields:
      - label: Título
        name: title
        widget: string
      - label: Precio (€)
        name: price
        widget: number
        value_type: float
        min: 0
      - label: Nota
        name: note
        widget: text
      - label: Cursos
        name: courses
        widget: list
        fields:
        - label: Texto
          name: label
          widget: string
        - label: Opciones
          name: options
          widget: list
          field:
            label: Elemento
            name: item
            widget: string
        summary: '{{fields.label}}'
    - label: Carta
      name: menu
      widget: list
      fields:
      - label: Nombre
        name: name
        widget: string
      - label: Platos
        name: items
        widget: list
        fields:
        - label: Nombre
          name: name
          widget: string
        - label: Descripción
          name: description
          widget: text
        - label: Precio (€)
          name: price
          widget: number
          value_type: float
          min: 0
        summary: '{{fields.name}}'
      summary: '{{fields.name}}'
    - label: El local
      name: ambience
      widget: object
      fields:
      - label: Título
        name: title
        widget: string
      - label: Texto
        name: text
        widget: text
      - label: Imágenes
        name: images
        widget: list
        fields:
        - label: Imagen
          name: url
          widget: image
        - label: Descripción de la imagen
          name: alt
          widget: string
    - label: Horarios
      name: openingHours
      widget: list
      fields:
      - label: Días
        name: days
        widget: string
      - label: Horario
        name: time
        widget: string
      summary: '{{fields.days}}'
    - label: Redes sociales
      name: socialLinks
      widget: object
      fields:
      - label: Instagram
        name: instagram
        widget: string
        required: false
      - label: Facebook
        name: facebook
        widget: string
        required: false
